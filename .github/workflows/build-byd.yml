name: Build BYD APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' gradlew

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create signing.properties
        run: |
          echo "STORE_FILE=keystore.jks" >> app/signing.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/signing.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/signing.properties

      - name: Build Release APK
        run: ./gradlew :app:assembleBydRelease

      - name: Get APK path
        id: apk-path
        run: |
          APK=$(find app/build/outputs/apk -name '*byd*release*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Get APK info
        id: apk-info
        uses: hkusu/apk-info-action@v1
        with:
          apk-path: ${{ steps.apk-path.outputs.path }}

      - name: Get bump commit message
        id: commit
        run: |
          MESSAGE=$(git log --format=%B --grep='^bump:' -i -1)

          if [ -z "$MESSAGE" ]; then
            echo "bump: commit not found"
            exit 1
          fi

          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate tag
        id: tag
        env:
          VERSION_NAME: ${{ steps.apk-info.outputs.version-name }}
        run: |
          version="${VERSION_NAME#*\(}"
          version="${version%\)}"
          
          TAG="byd-${version}-$(date +'%Y%m%d')"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release_feed.json
        env:
          TAG_NAME: ${{ steps.tag.outputs.TAG }}
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
          VERSION_NAME: ${{ steps.apk-info.outputs.version-name }}
          VERSION_CODE: ${{ steps.apk-info.outputs.version-code }}
          FILE_SIZE: ${{ steps.apk-info.outputs.file-size }}
        run: |
          SHA256=$(sha256sum "${{ steps.apk-path.outputs.path }}" | awk '{print $1}')
          TS=$(git log -1 --format=%ct)
          UPDATED_ON=$(date +"%b %d, %Y")
          LAST_COMMIT=$(git log -1 --pretty=%h)
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          
          jq -n \
            --arg version_name "$VERSION_NAME" \
            --arg version_code "$VERSION_CODE" \
            --arg sha256 "$SHA256" \
            --arg changelog "$COMMIT_MSG" \
            --arg size "$FILE_SIZE" \
            --arg last_commit "$LAST_COMMIT" \
            --arg updated_on "$UPDATED_ON" \
            --arg timestamp "$TS" \
            --arg download_url "${REPO_URL}/releases/download/${TAG_NAME}/app-byd-release.apk" \
            --arg icon_url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/master/app/src/main/res/mipmap-hdpi/ic_launcher.png" \
            '{version_name:$version_name, version_code:$version_code, download_url:$download_url, sha256:$sha256, icon_url:$icon_url, changelog:$changelog, size:$size, last_commit:$last_commit, updated_on:$updated_on, timestamp:$timestamp}' \
            > release_feed.json
          cat release_feed.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          body: ${{ steps.commit.outputs.message }}
          files: |
            ${{ steps.apk-path.outputs.path }}
            release_feed.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}